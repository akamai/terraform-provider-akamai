version: "2"
linters:
  default: none
  enable:
    - errcheck
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: errorf
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
  exclusions:
    rules:
      - linters:
          - errcheck
          - gocyclo
          - ineffassign
          - revive
        path: pkg/retryablehttp/.*\.go
      - linters:
          - gocyclo
          - staticcheck
          - unused
        path: gen\.go
      - linters:
          - misspell
        path: ruleformats/.*gen\.go
      - linters:
          - staticcheck
        path: pkg/providers/dns/internal/txtrecord/jparse\.go
      - linters:
          - staticcheck
        path: pkg/providers/property/resource_akamai_cp_code\.go
        text: "GetCPCodeDetail is deprecated|UpdateCPCode is deprecated"
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
